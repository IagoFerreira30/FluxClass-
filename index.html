<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxClass+ | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">

    <section class="lado-login">

      <header class="logo">
        <svg class="logo__icone" viewBox="0 0 74 66" width="74" height="66" aria-hidden="true">
          <defs>
            <linearGradient id="gradLogo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="66">
              <stop offset="0" stop-color="#11b4ff"/>
              <stop offset="0.55" stop-color="#4f7bff"/>
              <stop offset="1" stop-color="#7b3fff"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 60 V24 Q12 14 22 14 H44" stroke="url(#gradLogo)" stroke-width="13"/>
            <path d="M12 60 V24 Q12 14 22 14 H44" stroke="#fdfdff" stroke-width="7"/>
            <path d="M12 54 Q12 38 28 38 H40" stroke="url(#gradLogo)" stroke-width="3"/>
            <path d="M33 38 H48 M43 33 L48 38 L43 43" stroke="url(#gradLogo)" stroke-width="2.6"/>
            <path d="M66 3 V15 M60 9 H72" stroke="#8a3cff" stroke-width="2.6"/>
          </g>
        </svg>
        <p class="logo__nome"><span class="logo__flux">Flux</span><span class="logo__class">Class+</span></p>
        <p class="logo__slogan">Conhecimento em movimento</p>
      </header>

      <form class="cartao" action="#" method="post">
        <input class="campo campo--ativo" type="email" name="email" value="FluxClass@gmail.com" aria-label="E-mail" autocomplete="email">
        <input class="campo" type="password" name="senha" placeholder="Senha" aria-label="Senha" autocomplete="current-password">

        <div class="divisor">
          <span>Ou continue por:</span>
          <hr>
        </div>

        <div class="sociais">
          <button class="social social--google" type="button" aria-label="Continuar com Google">
            <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </button>
          <button class="social social--facebook" type="button" aria-label="Continuar com Facebook">
            <svg width="31" height="31" viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="24" fill="#1877F2"/>
              <path fill="#fff" d="M33.34 30.9 34.4 24h-6.62v-4.48c0-1.89.92-3.73 3.89-3.73h3.01v-5.88s-2.73-.47-5.34-.47c-5.45 0-9.01 3.3-9.01 9.28V24h-6.06v6.9h6.06V48a24.1 24.1 0 0 0 7.46 0V30.9h5.55z"/>
            </svg>
          </button>
        </div>

        <button class="acesso" type="submit">Acesse já</button>
      </form>

    </section>

    <aside class="lado-arte" aria-hidden="true">
      <span class="arco arco--1"></span>
      <span class="arco arco--2"></span>
      <span class="arco arco--3"></span>
      <span class="arco arco--4"></span>
      <span class="arco arco--5"></span>
      <span class="arco arco--6"></span>
      <span class="arco arco--7"></span>
    </aside>

  </main>
</body>
</html>
